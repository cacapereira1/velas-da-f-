<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velas da Fé</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: Arial; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); }

        header { background: #8B4513; color: white; padding: 1rem; position: fixed; width: 100%; top: 0; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }

        main { margin-top: 80px; padding: 20px; }

        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }

        .card { background: white; padding: 15px; border-radius: 10px; text-align: center; }

        .price { color: green; font-weight: bold; }

        button { background: #25d366; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }

        #cart { position: fixed; right: -300px; top: 100px; background: white; width: 300px; padding: 20px; transition: 0.3s; }
        #cart.open { right: 0; }
    </style>
</head>

<body>

<header>
    <nav>
        <h1>🕯️ Velas da Fé</h1>
        <ul>
            <li><a href="#">Produtos</a></li>
            <li><a href="#" id="cart-icon">🛒 <span id="count">0</span></a></li>
        </ul>
    </nav>
</header>

<main>

<h2>Produtos</h2>

<div class="products" id="products"></div>

</main>

<div id="cart">
    <h3>Carrinho</h3>
    <div id="items"></div>
    <h3 id="total">Total: R$ 0</h3>
    <button onclick="finalizar()">Finalizar no WhatsApp</button>
</div>

<script>
const products = [
    { id: 1, name: 'Velas Palito (unidade)', price: 1.50 },
    { id: 2, name: 'Velas Palito (kg)', price: 20.00 },
    { id: 3, name: 'Velas Palito Bicolor (kg)', price: 22.00 },
    { id: 4, name: 'Vela 7 Dias Bicolor', price: 10.00 },
    { id: 5, name: 'Vela 7 Dias Mel', price: 12.00 },
    { id: 6, name: 'Caixa 6 Velas 7 Dias Bicolor', price: 48.00 },
    { id: 7, name: 'Caixa 6 Velas 7 Dias', price: 36.00 },
    { id: 8, name: 'Caixa 100 Velas Palito Bicolor', price: 74.00 },
    { id: 9, name: 'Caixa 100 Velas Palito', price: 70.00 }
];

let cart = [];

function render() {
    document.getElementById('products').innerHTML = products.map(p => `
        <div class="card">
            <h3>${p.name}</h3>
            <p class="price">R$ ${p.price}</p>
            <button onclick="add(${p.id})">Adicionar</button>
        </div>
    `).join('');
}

function add(id) {
    const item = cart.find(i => i.id === id);
    if (item) item.qtd++;
    else cart.push({ ...products.find(p => p.id === id), qtd: 1 });
    update();
}

function update() {
    document.getElementById('count').innerText = cart.reduce((a,b)=>a+b.qtd,0);

    document.getElementById('items').innerHTML = cart.map(i => `
        <p>${i.name} x${i.qtd}</p>
    `).join('');

    let total = cart.reduce((a,b)=>a+(b.price*b.qtd),0);
    document.getElementById('total').innerText = "Total: R$ " + total.toFixed(2);
}

function finalizar() {
    let msg = "Pedido:%0A";
    cart.forEach(i => {
        msg += `${i.name} x${i.qtd}%0A`;
    });

    let total = cart.reduce((a,b)=>a+(b.price*b.qtd),0);
    msg += `%0ATotal: R$ ${total.toFixed(2)}`;

    window.open(`https://wa.me/5511986339143?text=${msg}`);
}

document.getElementById('cart-icon').onclick = () => {
    document.getElementById('cart').classList.toggle('open');
}

render();
</script>

</body>
</html>
